<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Usuario - Actividades</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/formularios.css">

</head>
<body>

  <div class="form-container">
    <h2>Registrar Nuevo Usuario</h2>
    <p style="color: #64748b; margin-bottom: 1rem;">Complete la información del usuario y configure sus tarifas</p>

    <div id="msg-box" class="alert-box"></div>

    <form id="userForm">
      <!-- Datos Personales y Credenciales -->
      <div class="section-title">Información Personal & Credenciales</div>
      <div class="form-grid">
        <div class="form-group">
          <label for="nombre">Nombre Completo *</label>
          <input type="text" id="nombre" class="form-control" required placeholder="Ej. Juan Pérez">
        </div>
        <div class="form-group">
          <label for="usuario">Usuario *</label>
          <input type="text" id="usuario" class="form-control" required placeholder="Ej. jperez">
        </div>
        <div class="form-group">
          <label for="password">Contraseña *</label>
          <input type="password" id="password" class="form-control" required placeholder="••••••••">
        </div>
        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input type="text" id="telefono" class="form-control" placeholder="0987654321">
        </div>
        <div class="form-group">
          <label for="direccion">Dirección</label>
          <input type="text" id="direccion" class="form-control" placeholder="Ej. Quito Norte">
        </div>
        <div class="form-group">
          <label for="sector">Sector</label>
          <select id="sector" class="form-control">
            <option value="CENTRO">CENTRO</option>
            <option value="NORTE">NORTE</option>
            <option value="SUR">SUR</option>
            <option value="VALLES">VALLES</option>
            <option value="OTROS VALLES">OTROS VALLES</option>
          </select>
        </div>
      </div>

      <!-- Configuración de Tarifas -->
      <div class="section-title">Tarifas Personalizadas ($)</div>
      <div class="form-grid">
        <div class="form-group">
          <label for="valor_act">Valor Actividad</label>
          <input type="number" step="0.01" id="valor_act" class="form-control" value="0">
        </div>
        <div class="form-group">
          <label for="valor_visit">Valor Visita</label>
          <input type="number" step="0.01" id="valor_visit" class="form-control" value="0">
        </div>
        <div class="form-group">
          <label for="valor_pred">Valor Punto Red</label>
          <input type="number" step="0.01" id="valor_pred" class="form-control" value="1.00">
        </div>
        <div class="form-group">
          <label for="valor_ac">Valor AC</label>
          <input type="number" step="0.01" id="valor_ac" class="form-control" value="1.00">
        </div>
        <div class="form-group">
          <label for="valor_exc">Valor Excedente (metro)</label>
          <input type="number" step="0.001" id="valor_exc" class="form-control" value="0.04">
        </div>
      </div>

      <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
        <button type="submit" id="btn-save" class="btn-primary" style="flex: 1; padding: 0.75rem;">Guardar Usuario</button>
        <button type="button" onclick="history.back()" class="btn-secondary" style="padding: 0.75rem;">Cancelar</button>
      </div>
    </form>
  </div>

<script>
  // Endpoints configurados correctamente
  const API_OBTENER_TODOS = 'https://actividades-fmax.vercel.app/api/obtener-usuarios';
  const API_CREAR = 'https://actividades-fmax.vercel.app/api/crear-usuario';
  const API_ACTUALIZAR = 'https://actividades-fmax.vercel.app/api/actualizar-usuario';

  // Leer ID de la URL (?edit=ID)
  const urlParams = new URLSearchParams(window.location.search);
  const userId = urlParams.get('edit');

  document.addEventListener('DOMContentLoaded', () => {
    if (userId) {
      // Ajustar la vista a Modo Edición
      const titulo = document.querySelector('h1');
      if (titulo) titulo.textContent = 'Editar Usuario';

      const btnSubmit = document.getElementById('btn-guardar') || document.querySelector('button[type="submit"]');
      if (btnSubmit) btnSubmit.textContent = 'Guardar Cambios';

      cargarDatosUsuario(userId);
    }
  });

  async function cargarDatosUsuario(id) {
    try {
      // Petición a la lista general para evitar el error 404
      const res = await fetch(API_OBTENER_TODOS);
      if (!res.ok) throw new Error('No se pudo conectar con el servidor.');

      const usuarios = await res.json();
      const user = usuarios.find(u => String(u.id) === String(id));

      if (!user) {
        alert('El usuario no existe o fue eliminado');
        return;
      }

      // Poblado seguro de inputs
      if (document.getElementById('nombre')) document.getElementById('nombre').value = user.nombre || '';
      if (document.getElementById('usuario')) document.getElementById('usuario').value = user.usuario || '';
      if (document.getElementById('telefono')) document.getElementById('telefono').value = user.telefono || '';
      if (document.getElementById('direccion')) document.getElementById('direccion').value = user.direccion || '';
      if (document.getElementById('sector')) document.getElementById('sector').value = user.sector || '';

      if (document.getElementById('valor_act')) document.getElementById('valor_act').value = user.valor_act ?? 7.00;
      if (document.getElementById('valor_pred')) document.getElementById('valor_pred').value = user.valor_pred ?? 1.00;
      if (document.getElementById('valor_ac')) document.getElementById('valor_ac').value = user.valor_ac ?? 1.00;
      if (document.getElementById('valor_exc')) document.getElementById('valor_exc').value = user.valor_exc ?? 0.04;
      if (document.getElementById('valor_visit')) document.getElementById('valor_visit').value = user.valor_visit ?? 6.00;

    } catch (err) {
      alert('Error al cargar datos: ' + err.message);
    }
  }

  // Evento submit con selector alternativo
  const formUsuario = document.getElementById('form-usuario') || document.querySelector('form');

  if (formUsuario) {
    formUsuario.addEventListener('submit', async (e) => {
      e.preventDefault();

      const payload = {
        nombre: document.getElementById('nombre')?.value,
        usuario: document.getElementById('usuario')?.value,
        telefono: document.getElementById('telefono')?.value,
        direccion: document.getElementById('direccion')?.value,
        sector: document.getElementById('sector')?.value,
        valor_act: document.getElementById('valor_act')?.value,
        valor_pred: document.getElementById('valor_pred')?.value,
        valor_ac: document.getElementById('valor_ac')?.value,
        valor_exc: document.getElementById('valor_exc')?.value,
        valor_visit: document.getElementById('valor_visit')?.value
      };

      let url = API_CREAR;
      if (userId) {
        payload.id = userId;
        url = API_ACTUALIZAR;
      }

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await res.json();
        if (!res.ok) throw new Error(result.error || 'Ocurrió un error al procesar');

        alert(userId ? 'Usuario actualizado con éxito' : 'Usuario creado con éxito');
        window.location.href = 'usuarios.html';
      } catch (err) {
        alert('Error: ' + err.message);
      }
    });
  }
</script>
</body>
</html>
