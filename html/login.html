<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Actividades</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/formularios.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: var(--bg-main, #0f172a);
      margin: 0;
    }
    .login-card {
      background: var(--bg-card, #1e293b);
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 380px;
      color: #fff;
    }
    .login-card h2 { margin-bottom: 0.5rem; text-align: center; }
    .login-card p { text-align: center; color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .error-msg {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Iniciar Sesión</h2>
    <p>Ingresa tus credenciales para continuar</p>

    <div id="error-box" class="error-msg"></div>

    <form id="loginForm">
      <div class="form-group" style="margin-bottom: 1.2rem;">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" class="form-control" required placeholder="Ej. dcunez" style="width: 100%; padding: 0.75rem;">
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label for="password">Contraseña</label>
        <input type="password" id="password" class="form-control" required placeholder="••••••••" style="width: 100%; padding: 0.75rem;">
      </div>

      <button type="submit" id="btn-submit" class="btn-primary" style="width: 100%; padding: 0.75rem; font-weight: 600;">
        Ingresar
      </button>
    </form>
  </div>

  <script>
    const API_LOGIN = 'https://actividades-fmax.vercel.app/api/login';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const errorBox = document.getElementById('error-box');
      const btnSubmit = document.getElementById('btn-submit');
      
      errorBox.style.display = 'none';
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Verificando...';

      const usuarioVal = document.getElementById('usuario').value.trim();
      const passwordVal = document.getElementById('password').value.trim();

      try {
        const res = await fetch(API_LOGIN, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario: usuarioVal, password: passwordVal })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Error al iniciar sesión');
        }

        // Guardar sesión localmente
        localStorage.setItem('usuarioSesion', JSON.stringify(data.user));

        // Redirigir al listado de actividades
        window.location.href = 'actividades.html';

      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Ingresar';
      }
    });
  </script>
</body>
</html>
