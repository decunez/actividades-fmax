<!DOCTYPE html>
<html lang="es">
<head>
  <script>
    // Validar si existe la sesión en el navegador
    const usuarioSesion = localStorage.getItem('usuarioSesion');
    
    if (!usuarioSesion) {
      // Redirigir al login si no ha iniciado sesión
      window.location.href = 'login.html'; // o '../index.html' según dónde esté tu vista de login
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actividad Propia</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/formularios.css">

  <main class="container" >
    <section class="header-section">
  <div>
    <h1>Registrar Actividad Propia</h1>
  </div>
</section>

    <div class="form-card">
      <form id="form-actividad-propia">
        <div class="form-grid">
          
          <!-- Usuario -->
          <div class="form-group">
            <label for="id_usuario">Usuario *</label>
            <select id="id_usuario" class="form-control" required>
              <option value="">Cargando usuarios...</option>
            </select>
          </div>

          <!-- Nombre del Cliente -->
          <div class="form-group">
  <label for="cliente">Nombre del Cliente</label>
  <input type="text" id="cliente" class="form-control" placeholder="Ej: Juan Pérez (Opcional)">
</div>

          <!-- Fecha -->
          <div class="form-group">
            <label for="fecha">Fecha *</label>
            <input type="date" id="fecha" class="form-control" required>
          </div>

          <!-- Tipo de Actividad -->
          <div class="form-group">
            <label for="tipo_actividad">Tipo de Actividad *</label>
            <select id="tipo_actividad" class="form-control" required>
              <option value="">Seleccione...</option>
              <option value="INSTALACION">INSTALACION</option>
              <option value="TRASLADO">TRASLADO</option>
              <option value="VISITA">VISITA</option>
            </select>
          </div>

          <!-- Forma de Actividad -->
          <div class="form-group">
            <label for="forma_actividad">Forma de Actividad *</label>
            <select id="forma_actividad" class="form-control" required disabled>
              <option value="">Seleccione tipo primero...</option>
            </select>
          </div>

          <!-- Cantidad Fibra -->
          <div class="form-group">
            <label for="cantidad_fibra">Cantidad Fibra (metros)</label>
            <input type="number" id="cantidad_fibra" class="form-control" placeholder="0" min="0" value="0">
          </div>

          <!-- Punto de Red (Radio Buttons) -->
          <div class="form-group">
            <label>¿Punto de Red?</label>
            <div class="radio-container">
              <label class="radio-label">
                <input type="radio" name="tiene_punto_red" value="NO" checked> NO
              </label>
              <label class="radio-label">
                <input type="radio" name="tiene_punto_red" value="SI"> SI
              </label>
            </div>
          </div>

          <div class="form-group" id="group-punto-red-cant" style="display: none;">
            <label for="punto_red_cant">Cantidad Punto Red</label>
            <select id="punto_red_cant" class="form-control">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </div>

          <!-- AC (Radio Buttons) -->
          <div class="form-group">
            <label>¿Equipo AC?</label>
            <div class="radio-container">
              <label class="radio-label">
                <input type="radio" name="tiene_ac" value="NO" checked> NO
              </label>
              <label class="radio-label">
                <input type="radio" name="tiene_ac" value="SI"> SI
              </label>
            </div>
          </div>

          <div class="form-group" id="group-ac-cant" style="display: none;">
            <label for="ac_cant">Cantidad AC</label>
            <select id="ac_cant" class="form-control">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </div>

        </div>

        <!-- Resumen de Valores Calculados Automáticamente -->
        <div class="summary-box">
          <div class="summary-item">
            <span>Cantidad</span>
            <strong id="disp_cantidad_act">1</strong>
          </div>
          <div class="summary-item">
            <span>Valor Actividad</span>
            <strong id="disp_valor_actividad">$0.00</strong>
          </div>
          <div class="summary-item">
            <span>Punto de Red</span>
            <strong id="disp_valor_pred">$0.00</strong>
          </div>
          <div class="summary-item">
            <span>Equipo AC</span>
            <strong id="disp_valor_ac">$0.00</strong>
          </div>
          <div class="summary-item">
            <span>Excedente (m)</span>
            <strong id="disp_exedente">0</strong>
          </div>
          <div class="summary-item">
            <span>Valor Excedente</span>
            <strong id="disp_valor_exedente">$0.00</strong>
          </div>
          <div class="summary-item total-box">
            <span>TOTAL ACTIVIDAD</span>
            <strong id="disp_total_act">$0.00</strong>
          </div>
        </div>

        <div style="margin-top: 1.5rem; display: flex; justify-content: flex-end; gap: 1rem; align-items: center;">
          <a href="../index.html" class="btn-secondary" style="padding: 0.85rem 2rem; text-decoration: none;">Cancelar</a>
          <button type="submit" class="btn-primary" style="padding: 0.85rem 2rem;">Guardar Actividad</button>
        </div>
      </form>
    </div>
  </main>

  <script src="../script.js"></script>
<script>
let usuariosCache = [];
let idActividadEditando = null;

document.addEventListener('DOMContentLoaded', async () => {
  // 1. Cargar la lista de usuarios
  await cargarUsuariosSelect();

  // 2. Establecer la fecha de hoy por defecto
  document.getElementById('fecha').value = new Date().toISOString().split('T')[0];

  // 3. Registrar Event Listeners
  document.getElementById('tipo_actividad').addEventListener('change', () => {
    actualizarFormaActividad();
    calcularValores();
  });
  
  document.getElementById('forma_actividad').addEventListener('change', calcularValores);
  document.getElementById('cantidad_fibra').addEventListener('input', calcularValores);

  // Listeners Radio Buttons (Punto de Red)
  document.querySelectorAll('input[name="tiene_punto_red"]').forEach(r => {
    r.addEventListener('change', (e) => {
      document.getElementById('group-punto-red-cant').style.display = e.target.value === 'SI' ? 'flex' : 'none';
      calcularValores();
    });
  });
  document.getElementById('punto_red_cant').addEventListener('change', calcularValores);

  // Listeners Radio Buttons (Equipo AC)
  document.querySelectorAll('input[name="tiene_ac"]').forEach(r => {
    r.addEventListener('change', (e) => {
      document.getElementById('group-ac-cant').style.display = e.target.value === 'SI' ? 'flex' : 'none';
      calcularValores();
    });
  });
  document.getElementById('ac_cant').addEventListener('change', calcularValores);

  // Formulario Submit
  document.getElementById('form-actividad-propia').addEventListener('submit', guardarActividad);

  // 4. Verificar y cargar datos en modo Edición
  cargarDatosEdicion();
});

function cargarDatosEdicion() {
  const datosEdit = localStorage.getItem('actividadEditando');
  if (!datosEdit) return;

  const act = JSON.parse(datosEdit);
  idActividadEditando = act.id || act.id_actividad || null;

  // Cargar Cliente, Fecha y Usuario
  if (act.cliente) document.getElementById('cliente').value = act.cliente;
  if (act.fecha) document.getElementById('fecha').value = act.fecha.toString().substring(0, 10);
  if (act.id_usuario) document.getElementById('id_usuario').value = act.id_usuario;

  // Cargar Tipo de Actividad y desplegar sus Opciones de Forma
  if (act.tipo_actividad) {
    document.getElementById('tipo_actividad').value = act.tipo_actividad;
    actualizarFormaActividad(); 
  }

  // Cargar Forma de Actividad
  if (act.forma_actividad) {
    document.getElementById('forma_actividad').value = act.forma_actividad;
  }

  // Cargar Cantidad de Fibra
  document.getElementById('cantidad_fibra').value = act.cantidad_fibra || act.fibra || 0;

  // Cargar Punto de Red
  const tienePunto = (act.punto_red > 0 || act.tiene_punto_red === 'SI');
  const radioPunto = document.querySelector(`input[name="tiene_punto_red"][value="${tienePunto ? 'SI' : 'NO'}"]`);
  if (radioPunto) {
    radioPunto.checked = true;
    document.getElementById('group-punto-red-cant').style.display = tienePunto ? 'flex' : 'none';
    if (tienePunto) document.getElementById('punto_red_cant').value = act.punto_red || 1;
  }

  // Cargar Equipo AC
  const tieneAc = (act.ac > 0 || act.tiene_ac === 'SI');
  const radioAc = document.querySelector(`input[name="tiene_ac"][value="${tieneAc ? 'SI' : 'NO'}"]`);
  if (radioAc) {
    radioAc.checked = true;
    document.getElementById('group-ac-cant').style.display = tieneAc ? 'flex' : 'none';
    if (tieneAc) document.getElementById('ac_cant').value = act.ac || 1;
  }

  // Recalcular montos en la interfaz
  calcularValores();

  // Cambiar el texto del botón
  const btnSubmit = document.querySelector('#form-actividad-propia button[type="submit"]') || document.querySelector('.btn-primary');
  if (btnSubmit) btnSubmit.textContent = 'Actualizar Actividad';

  // Limpiar almacenamiento temporal
  localStorage.removeItem('actividadEditando');
}

async function cargarUsuariosSelect() {
  const select = document.getElementById('id_usuario');
  try {
    const res = await fetch('https://actividades-fmax.vercel.app/api/usuarios');
    usuariosCache = await res.json();
    select.innerHTML = '<option value="">Seleccione un usuario...</option>';
    
    usuariosCache.forEach(u => {
      const selectedAttr = u.id == 1 ? 'selected' : '';
      select.innerHTML += `<option value="${u.id}" ${selectedAttr}>${u.nombre} (${u.sector || 'S/N'})</option>`;
    });

    if (usuariosCache.some(u => u.id == 1)) {
      select.value = '1';
    }
  } catch (err) {
    select.innerHTML = '<option value="">Error al cargar usuarios</option>';
  }
}

function actualizarFormaActividad() {
  const tipo = document.getElementById('tipo_actividad').value;
  const selectForma = document.getElementById('forma_actividad');

  selectForma.innerHTML = '';
  selectForma.disabled = false;

  if (tipo === 'INSTALACION' || tipo === 'TRASLADO') {
    selectForma.innerHTML = `
      <option value="NORMAL">NORMAL</option>
      <option value="DUCTERIA">DUCTERIA/SOTERRADO</option>
    `;
  } else if (tipo === 'VISITA') {
    selectForma.innerHTML = `
      <option value="NORMAL">CAMBIO CONECTOR</option>
      <option value="RECABLEADO-NORMAL">RECABLEADO-NORMAL</option>
      <option value="RECABLEADO-DUCTERIA">RECABLEADO-DUCTERIA</option>
      <option value="RECABLEADO-SOTERRADO">RECABLEADO-SOTERRADO</option>
    `;
  } else {
    selectForma.innerHTML = '<option value="">Seleccione tipo primero...</option>';
    selectForma.disabled = true;
  }
}

function calcularValores() {
  const tipo = document.getElementById('tipo_actividad').value;
  const forma = document.getElementById('forma_actividad').value;
  const fibra = parseInt(document.getElementById('cantidad_fibra').value) || 0;

  // 1. cantidad_act
  const cantidad_act = forma === 'DUCTERIA' ? 2 : 1;

  // 2. valor_actividad
  let valor_actividad = 0;
  if (tipo === 'INSTALACION' || tipo === 'TRASLADO') {
    valor_actividad = forma === 'DUCTERIA' ? 14 : 7;
  } else if (tipo === 'VISITA') {
    if (forma === 'NORMAL') valor_actividad = 6;
    else if (forma === 'RECABLEADO-NORMAL') valor_actividad = 7;
    else if (forma === 'RECABLEADO-DUCTERIA') valor_actividad = 14;
    else if (forma === 'RECABLEADO-SOTERRADO') valor_actividad = 14;
  }

  // 3. punto_red y valor_pred
  const puntoRedChecked = document.querySelector('input[name="tiene_punto_red"]:checked');
  const tienePunto = puntoRedChecked ? puntoRedChecked.value === 'SI' : false;
  const punto_red = tienePunto ? (parseInt(document.getElementById('punto_red_cant').value) || 0) : 0;
  const valor_pred = punto_red * 1;

  // 4. ac y valor_ac
  const acChecked = document.querySelector('input[name="tiene_ac"]:checked');
  const tieneAc = acChecked ? acChecked.value === 'SI' : false;
  const ac = tieneAc ? (parseInt(document.getElementById('ac_cant').value) || 0) : 0;
  const valor_ac = ac * 1;

  // 5. exedente y valor_exedente
  const exedente = fibra > 350 ? fibra - 350 : 0;
  const valor_exedente = exedente * 0.04;

  // 6. Total actividad
  const total_act = valor_actividad + valor_pred + valor_ac + valor_exedente;

  // Renderizar interfaz
  document.getElementById('disp_cantidad_act').textContent = cantidad_act;
  document.getElementById('disp_valor_actividad').textContent = `$${valor_actividad.toFixed(2)}`;
  document.getElementById('disp_valor_pred').textContent = `$${valor_pred.toFixed(2)}`;
  document.getElementById('disp_valor_ac').textContent = `$${valor_ac.toFixed(2)}`;
  document.getElementById('disp_exedente').textContent = exedente;
  document.getElementById('disp_valor_exedente').textContent = `$${valor_exedente.toFixed(2)}`;
  document.getElementById('disp_total_act').textContent = `$${total_act.toFixed(2)}`;

  return {
    cantidad_act, valor_actividad, punto_red, valor_pred,
    ac, valor_ac, exedente, valor_exedente, total_act
  };
}

async function guardarActividad(e) {
  e.preventDefault();
  const calc = calcularValores();
  const usuarioSel = usuariosCache.find(u => u.id == document.getElementById('id_usuario').value);

  const clienteInput = document.getElementById('cliente').value.trim();
  const clienteFinal = clienteInput !== '' ? clienteInput : 'NO DEFINIDO';

  const payload = {
    id_usuario: parseInt(document.getElementById('id_usuario').value),
    cliente: clienteFinal,
    fecha: document.getElementById('fecha').value,
    cuadrilla: 'PROPIA',
    sector: usuarioSel ? usuarioSel.sector : '',
    tipo_actividad: document.getElementById('tipo_actividad').value,
    forma_actividad: document.getElementById('forma_actividad').value,
    cantidad_act: calc.cantidad_act,
    valor_actividad: calc.valor_actividad,
    cantidad_fibra: parseInt(document.getElementById('cantidad_fibra').value) || 0,
    punto_red: calc.punto_red,
    valor_pred: calc.valor_pred,
    ac: calc.ac,
    valor_ac: calc.valor_ac,
    exedente: calc.exedente,
    valor_exedente: calc.valor_exedente,
    total_act: calc.total_act
  };

  if (idActividadEditando) {
    payload.id = idActividadEditando;
  }

  try {
    const res = await fetch('https://actividades-fmax.vercel.app/api/activida-propia', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (res.ok) {
      alert(idActividadEditando ? 'Actividad actualizada correctamente' : 'Actividad registrada correctamente');
      window.location.href = '../index.html';
    } else {
      alert('Error al guardar la actividad');
    }
  } catch (err) {
    console.error(err);
    alert('Error de conexión');
  }
}
</script>
</body>
</html>
