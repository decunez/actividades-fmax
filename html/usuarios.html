<!DOCTYPE html>
<html lang="es">
<head>
  <script>
    const usuarioSesion = localStorage.getItem('usuarioSesion');
    if (!usuarioSesion) {
      window.location.href = 'login.html';
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios - Sistema FMAX</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">

  <style>
    /* Estilos forzados para garantizar visibilidad de botones */
    .btn-edit-usr {
      background-color: #0284c7 !important;
      color: #ffffff !important;
      border: none !important;
      padding: 6px 12px !important;
      border-radius: 4px !important;
      cursor: pointer !important;
      font-weight: 600 !important;
      margin-right: 6px !important;
      display: inline-block !important;
    }
    .btn-edit-usr:hover {
      background-color: #0369a1 !important;
    }
    .btn-delete-usr {
      background-color: #dc2626 !important;
      color: #ffffff !important;
      border: none !important;
      padding: 6px 12px !important;
      border-radius: 4px !important;
      cursor: pointer !important;
      font-weight: 600 !important;
      display: inline-block !important;
    }
    .btn-delete-usr:hover {
      background-color: #b91c1c !important;
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="nav-header">

      <h2>Actividades</h2>

  </div>

  <div id="nav-content" class="nav-content">
    <div class="nav-links">
      <a href="index.html" class="nav-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Inicio</span>
      </a>
      <a href="actividades.html" class="nav-link">Actividades</a>
      <a href="#" class="nav-link">Reportes</a>
      <a href="usuarios.html" class="nav-link active">Configuración</a>
    </div>

    <div class="nav-actions">
      <button onclick="cerrarSesion()" class="btn-logout">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Cerrar Sesión</span>

</nav>

  <main class="container">
    <section class="header-section">
      <div>
        <h1>Gestión de Usuarios</h1>
        <p style="color: var(--text-muted);">Directorio de usuarios registrados en el sistema</p>
      </div>
      <button class="btn-primary" onclick="window.location.href='crear_usuario.html'">+ Nuevo Usuario</button>
    </section>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>NOMBRE</th>
            <th>TELÉFONO</th>
            <th>DIRECCIÓN</th>
            <th>SECTOR</th>
            <th style="text-align: center;">ACCIONES</th>
          </tr>
        </thead>
        <tbody id="tabla-usuarios">
          <tr>
            <td colspan="6" style="text-align: center;">Cargando usuarios...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer style="text-align: center;">
    <p>&copy; 2026 Daniel Cuñez - Todos los derechos reservados</p>
  </footer>

  <script src="../script.js"></script>

  <script>
    const API_OBTENER = 'https://actividades-fmax.vercel.app/api/usuarios';
    const API_ELIMINAR = 'https://actividades-fmax.vercel.app/api/eliminar-usuario';

document.addEventListener('DOMContentLoaded', () => {
  const badge = document.getElementById('user-badge');
  const sesion = localStorage.getItem('usuarioSesion');

  // Redirigir si no hay sesión activa
  if (!sesion) {
    window.location.href = '../index.html';
    return;
  }

  if (badge) {
    try {
      // Si la sesión se guardó como objeto JSON
      const user = JSON.parse(sesion);
      badge.textContent = user.nombre || user.usuario || sesion;
    } catch (e) {
      // Si la sesión se guardó como texto plano
      badge.textContent = sesion;
    }
  }
});

    function renderizarTabla(listaUsuarios) {
      const tbody = document.getElementById('tabla-usuarios');
      if (!tbody) return;
      tbody.innerHTML = '';

      if (!Array.isArray(listaUsuarios) || listaUsuarios.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No hay usuarios registrados.</td></tr>';
        return;
      }

      listaUsuarios.forEach(user => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${user.id}</td>
          <td><strong>${user.nombre || ''}</strong></td>
          <td>${user.telefono || '-'}</td>
          <td>${user.direccion || '-'}</td>
          <td><strong>${user.sector || '-'}</strong></td>
          <td style="text-align: center; white-space: nowrap;">
            <button class="btn-edit-usr" data-id="${user.id}">Editar</button>
            <button class="btn-delete-usr" data-id="${user.id}" data-nombre="${user.nombre || ''}">Eliminar</button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      // Asignar eventos a los botones generados
      tbody.querySelectorAll('.btn-edit-usr').forEach(btn => {
        btn.addEventListener('click', () => {
          window.location.href = `crear_usuario.html?edit=${btn.dataset.id}`;
        });
      });

      tbody.querySelectorAll('.btn-delete-usr').forEach(btn => {
        btn.addEventListener('click', () => {
          eliminarUsuario(btn.dataset.id, btn.dataset.nombre);
        });
      });
    }

    async function eliminarUsuario(id, nombre) {
      if (!confirm(`¿Estás seguro de eliminar a "${nombre}"?`)) return;

      try {
        const res = await fetch(API_ELIMINAR, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'No se pudo eliminar');

        alert('Usuario eliminado correctamente');
        cargarUsuarios();

      } catch (err) {
        alert('Error: ' + err.message);
      }
    }
  </script>
</body>
</html>
