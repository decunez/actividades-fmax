<!DOCTYPE html>
<html lang="es">
<head>
  <script>
    const usuarioSesion = localStorage.getItem('usuarioSesion');
    if (!usuarioSesion) {
      window.location.href = 'login.html';
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios - Sistema FMAX</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">

  <style>
    /* Estilos para los botones de Acción */
    .btn-action {
      padding: 0.4rem 0.75rem;
      font-size: 0.85rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      margin: 0 0.2rem;
      transition: background 0.2s;
    }
    .btn-edit {
      background-color: #e0f2fe;
      color: #0369a1;
    }
    .btn-edit:hover {
      background-color: #bae6fd;
    }
    .btn-delete {
      background-color: #fee2e2;
      color: #b91c1c;
    }
    .btn-delete:hover {
      background-color: #fecaca;
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="nav-header">
    <div class="user-container">
      <h2>Actividades</h2>
      <span id="user-badge" class="user-pill">Cargando...</span>
    </div>
    <button id="btn-menu" class="hamburger-btn" aria-label="Abrir menú">☰</button>
  </div>

  <div id="nav-content" class="nav-content">
    <div class="nav-links">
      <a href="index.html" class="nav-link active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Inicio</span>
      </a>
      <a href="actividades.html" class="nav-link">Actividades</a>
      <a href="#" class="nav-link">Reportes</a>
      <a href="usuarios.html" class="nav-link">Configuracion</a>
    </div>

    <div class="nav-actions">
      <button onclick="cerrarSesion()" class="btn-logout">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Cerrar Sesión</span>
      </button>
    </div>
  </div>
</nav>

  <!-- Contenido Principal -->
  <main class="container">
    <section class="header-section">
      <div>
        <h1>Gestión de Usuarios</h1>
        <p style="color: var(--text-muted);">Directorio de usuarios registrados en el sistema</p>
      </div>
      <button class="btn-primary" onclick="window.location.href='crear-usuario.html'">+ Nuevo Usuario</button>
    </section>

    <!-- Tabla dinámicamente poblada -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>NOMBRE</th>
            <th>TELÉFONO</th>
            <th>DIRECCIÓN</th>
            <th>SECTOR</th>
            <th style="text-align: center;">ACCIONES</th>
          </tr>
        </thead>
        <tbody id="tabla-usuarios">
          <tr>
            <td colspan="6" class="loading-cell" style="text-align: center;">Cargando usuarios desde la base de datos...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer style="text-align: center;">
    <p>&copy; 2026 Daniel Cuñez - Todos los derechos reservados</p>
  </footer>

  <!-- Script global (Navegación y Sesión) -->
  <script src="../script.js"></script>

  <!-- Script exclusivo para cargar la tabla de Usuarios -->
  <script>
    const API_OBTENER = 'https://actividades-fmax.vercel.app/api/obtener-usuarios';
    const API_ELIMINAR = 'https://actividades-fmax.vercel.app/api/eliminar-usuario';

    document.addEventListener('DOMContentLoaded', cargarUsuarios);

    async function cargarUsuarios() {
      try {
        const res = await fetch(API_OBTENER);
        const usuarios = await res.json();
        renderizarTabla(usuarios);
      } catch (err) {
        console.error('Error al obtener usuarios:', err);
      }
    }

    function renderizarTabla(listaUsuarios) {
      // ID corregido para que coincida con el tbody del HTML
      const tbody = document.getElementById('tabla-usuarios');
      if (!tbody) return;
      tbody.innerHTML = '';

      listaUsuarios.forEach(user => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${user.id}</td>
          <td><strong>${user.nombre}</strong></td>
          <td>${user.telefono || '-'}</td>
          <td>${user.direccion || '-'}</td>
          <td><strong>${user.sector || '-'}</strong></td>
          <td style="text-align: center;">
            <button class="btn-action btn-edit" onclick="editarUsuario(${user.id})">Editar</button>
            <button class="btn-action btn-delete" onclick="eliminarUsuario(${user.id}, '${user.nombre}')">Eliminar</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function eliminarUsuario(id, nombre) {
      if (!confirm(`¿Estás seguro de que deseas eliminar a "${nombre}"?`)) return;

      try {
        const res = await fetch(API_ELIMINAR, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'No se pudo eliminar');

        alert('Usuario eliminado correctamente');
        cargarUsuarios();

      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    function editarUsuario(id) {
      window.location.href = `crear-usuario.html?edit=${id}`;
    }
  </script>
</body>
</html>
