<!DOCTYPE html>
<html lang="es">
<head>
  <script>
    // Validar si existe la sesión en el navegador
    const usuarioSesion = localStorage.getItem('usuarioSesion');
    
    if (!usuarioSesion) {
      // Redirigir al login si no ha iniciado sesión
      window.location.href = 'login.html'; // o '../index.html' según dónde esté tu vista de login
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios - Sistema FMAX</title>
  <!-- Fuente Google Fonts -->

  <!-- Estilos globales -->

</head>
<body>

<nav class="navbar">
  <!-- Encabezado fijo (Título, Usuario y Botón Menú) -->

    <div class="user-container">
      <h2>Actividades</h2>
      <span id="user-badge" class="user-pill">Cargando...</span>
    </div>
    <button id="btn-menu" class="hamburger-btn" aria-label="Abrir menú">☰</button>
  </div>

  <!-- Contenedor Desplegable -->
  <div id="nav-content" class="nav-content">
    <!-- Enlaces Principales -->
    <div class="nav-links">
      <a href="index.html" class="nav-link active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Inicio</span>
      </a>
      <a href="actividades.html" class="nav-link">Actividades</a>
      <a href="#" class="nav-link">Reportes</a>
      <a href="usuarios.html" class="nav-link">Configuracion</a>
    </div>

    <!-- Botón Cerrar Sesión -->
    <div class="nav-actions">
      <button onclick="cerrarSesion()" class="btn-logout">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Cerrar Sesión</span>
      </button>
    </div>
  </div>
</nav>

  <!-- Contenido Principal -->
  <main class="container">
    <section class="header-section">
      <div>
        <h1>Gestión de Usuarios</h1>
        <p style="color: var(--text-muted);">Directorio de usuarios registrados en el sistema</p>
      </div>
      <button class="btn-primary" onclick="window.location.href='crear_usuario.html'">+ Nuevo Usuario</button>
    </section>

    <!-- Tabla dinámicamente poblada por script.js -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Teléfono</th>
            <th>Dirección</th>
            <th>Sector</th>
          </tr>
        </thead>
        <tbody id="tabla-usuarios">
          <tr>
            <td colspan="5" class="loading-cell">Cargando usuarios desde la base de datos...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Pie de página -->
<footer style="text-align: center;">
  <p>&copy; 2026 Daniel Cuñez - Todos los derechos reservados</p>
</footer>

  <!-- Enlace a la lógica dinámica -->
  <script src="../script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
  const usuarioSesion = localStorage.getItem('usuarioSesion');

  if (usuarioSesion) {
    const user = JSON.parse(usuarioSesion);
    
    // Busca el campo del nombre en la respuesta del backend
    const nombreUsuario = user.nombre || user.nombre_completo || user.usuario || 'Usuario';
    
    // Asigna el texto a la etiqueta
    const badge = document.getElementById('user-badge');
    if (badge) {
      badge.textContent = nombreUsuario;
    }
  }
});

/* ==========================================
   LÓGICA GLOBAL DE NAVEGACIÓN Y SESIÓN
   ========================================== */

// Función global de cierre de sesión
function cerrarSesion() {
  localStorage.removeItem('usuarioSesion');
  // Redirige al login o página principal
  window.location.href = '../index.html';
}

document.addEventListener('DOMContentLoaded', () => {
  // 1. MENÚ HAMBURGUESA RESPONSIVO
  const btnMenu = document.getElementById('btn-menu');
  const navContent = document.getElementById('nav-content');

  if (btnMenu && navContent) {
    // Abrir / Cerrar menú al presionar el botón
    btnMenu.addEventListener('click', (e) => {
      e.stopPropagation();
      navContent.classList.toggle('show');
    });

    // Cerrar el menú si se hace clic fuera de él
    document.addEventListener('click', (e) => {
      if (!navContent.contains(e.target) && !btnMenu.contains(e.target)) {
        navContent.classList.remove('show');
      }
    });

    // Cerrar el menú al presionar un enlace de navegación
    const links = navContent.querySelectorAll('.nav-link');
    links.forEach(link => {
      link.addEventListener('click', () => {
        navContent.classList.remove('show');
      });
    });
  }

  // 2. ACTUALIZAR INSIGNIA DE USUARIO (USER BADGE)
  const badge = document.getElementById('user-badge');
  if (badge) {
    const usuarioSesion = localStorage.getItem('usuarioSesion');
    if (usuarioSesion) {
      try {
        const user = JSON.parse(usuarioSesion);
        badge.textContent = user.nombre || user.nombre_completo || user.usuario || 'Usuario';
      } catch (err) {
        badge.textContent = 'Usuario';
      }
    }
  }

  // 3. REMARCAR AUTOMÁTICAMENTE EL ENLACE ACTIVO SEGÚN LA PÁGINA
  const paginaActual = window.location.pathname.split('/').pop() || 'index.html';
  const navLinks = document.querySelectorAll('.nav-link');

  navLinks.forEach(link => {
    const href = link.getAttribute('href');
    if (href === paginaActual) {
      link.classList.add('active');
    } else {
      link.classList.remove('active');
    }
  });
});
  </script>
</body>
</html>
