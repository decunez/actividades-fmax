<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Actividades</title>

  <!-- Verificación: Si ya inició sesión, redirige automáticamente al Dashboard -->
  <script>
    if (localStorage.getItem('usuarioSesion')) {
      window.location.href = 'html/index.html';
    }
  </script>
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0284c7">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <!-- Rutas relativas ajustadas para la raíz del proyecto -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/formularios.css">
  <link rel="stylesheet" href="css/login.css">

</head>
<body>

  <div class="login-card">
    <h2>Iniciar Sesión</h2>
    <p>Ingresa tus credenciales para continuar</p>

    <div id="error-box" class="error-msg"></div>

    <form id="loginForm">
      <div class="form-group" style="margin-bottom: 1.2rem;">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" class="form-control" required placeholder="Ej. dcunez" style="width: 100%; padding: 0.75rem;">
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label for="password">Contraseña</label>
        <input type="password" id="password" class="form-control" required placeholder="••••••••" style="width: 100%; padding: 0.75rem;">
      </div>

      <button type="submit" id="btn-submit" class="btn-primary" style="width: 100%; padding: 0.75rem; font-weight: 600;">
        Ingresar
      </button>
    </form>
  </div>

  <script>
    const API_LOGIN = 'https://actividades-fmax.vercel.app/api/login';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const errorBox = document.getElementById('error-box');
      const btnSubmit = document.getElementById('btn-submit');
      
      errorBox.style.display = 'none';
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Verificando...';

      const usuarioVal = document.getElementById('usuario').value.trim();
      const passwordVal = document.getElementById('password').value.trim();

      try {
        const res = await fetch(API_LOGIN, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario: usuarioVal, password: passwordVal })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Error al iniciar sesión');
        }

        // Guardar datos del usuario autenticado
        localStorage.setItem('usuarioSesion', JSON.stringify(data.user));

        // Redirigir al dashboard dentro de la carpeta /html
        window.location.href = 'html/index.html';

      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Ingresar';
      }
    });
  </script>

  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(() => console.log('Service Worker registrado con éxito'))
        .catch(err => console.error('Error registrando Service Worker:', err));
    });
  }
</script>
</body>
</html>
